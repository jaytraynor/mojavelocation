<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALAMITIES — Location Scout</title>
<meta name="description" content="Location scout board — cheating West Texas in Southern California.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,300;0,400;0,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <h1 id="brand-title">CALAMITIES</h1>
      <span class="sub" id="brand-sub">Location Scout</span>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Regions"></div>
  </header>

  <div class="shell">
    <nav class="sidebar" aria-label="Scenes">
      <div class="side-h">Scenes</div>
      <div id="scene-list"></div>
    </nav>

    <main class="main">
      <div class="region-strip" id="region-strip"></div>
      <div id="map" aria-label="Map of location options"></div>
      <div class="cards-head" id="cards-head"></div>
      <div class="cards" id="cards"></div>
    </main>
  </div>

  <footer class="app-foot">
    CALAMITIES · Location Scout · &copy; <span id="year"></span> — edit <b>data.js</b> to add options · pins appear when you add lat/lng
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
