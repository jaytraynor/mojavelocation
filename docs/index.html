<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALAMITIES — Enchantment Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{
  --paper:#EAE3D3; --panel:#201B15; --ink:#1A1611; --ink-2:#5A4E3E;
  --bone:#F2ECDD; --oxblood:#8A2417; --caliche:#B7A57F; --line:rgba(183,165,127,.55);
  --idea:#8a7f6c; --toscout:#B0731A; --scouted:#2C6E8F; --confirmed:#3E7D4E;
  --rc:#8A2417;
  --f-disp:'Oswald',system-ui,sans-serif; --f-mono:'Courier Prime',monospace; --f-body:'Spectral',Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--oxblood);color:var(--bone)}

/* header */
.hdr{background:var(--panel);color:var(--bone);display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:12px 18px;border-bottom:2px solid var(--oxblood);flex-wrap:wrap}
.hdr-l{display:flex;align-items:baseline;gap:12px}
.hdr h1{font-family:var(--f-disp);font-weight:700;letter-spacing:.06em;font-size:22px;margin:0;text-transform:uppercase}
.hdr .loc{font-family:var(--f-mono);font-size:12px;color:var(--caliche);letter-spacing:.03em}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:12px;color:var(--caliche);background:transparent;
  border:1px solid #3a332a;border-radius:20px;padding:4px 12px}
.pill:hover{color:var(--bone);border-color:var(--caliche)}
.pill[aria-selected="true"]{background:var(--rc);color:#fff;border-color:var(--rc)}
.pill .c{opacity:.7;margin-left:5px}

/* toolbar */
.bar{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--bone);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:420px;font-family:var(--f-body);font-size:15px;padding:8px 12px;
  border:1px solid var(--caliche);border-radius:6px;background:#fff;color:var(--ink)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.ghost{font-family:var(--f-mono);font-size:12px;color:var(--rc);background:#fff;border:1px solid var(--caliche);
  border-radius:6px;padding:7px 12px}
.ghost:hover{background:var(--paper)}
.bar .ghost{margin-left:auto}

/* body */
.wrap{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
.list{overflow-y:auto;background:var(--bone);border-right:1px solid var(--line);padding:8px}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-left:4px solid var(--idea);border-radius:6px;padding:9px 11px;margin-bottom:7px}
.row:hover{border-color:var(--rc);box-shadow:0 4px 12px -8px rgba(23,19,15,.5)}
.row.sel{border-color:var(--rc);border-left-color:var(--rc);background:var(--paper)}
.row.s-to-scout{border-left-color:var(--toscout)} .row.s-scouted{border-left-color:var(--scouted)}
.row.s-confirmed{border-left-color:var(--confirmed)}
.row .rn{font-family:var(--f-disp);font-weight:600;text-transform:uppercase;letter-spacing:.01em;font-size:14px;line-height:1.15}
.row .rs{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);margin-top:2px}
.row .rt{font-family:var(--f-mono);font-size:10px;color:var(--rc);display:block;margin-top:2px}
.row .go{margin-left:auto;color:var(--caliche);font-size:18px;flex:none}
.empty{padding:26px 16px;text-align:center;color:var(--ink-2);font-family:var(--f-mono);font-size:13px}

#map{min-height:300px;z-index:0;background:#cfc7b3}

/* modal */
.modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modal-bg{position:absolute;inset:0;background:rgba(20,16,12,.7)}
.sheet{position:relative;z-index:1;width:min(880px,96vw);max-height:92vh;overflow:auto;background:var(--bone);
  border:1px solid var(--caliche);border-radius:10px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);display:flex;flex-direction:column}
.x{position:absolute;top:8px;right:10px;z-index:3;background:rgba(20,16,12,.6);color:#fff;border:none;border-radius:50%;
  width:34px;height:34px;font-size:22px;line-height:1}
.x:hover{background:var(--oxblood)}
.gallery{width:100%;aspect-ratio:16/9;background:#000;position:relative;overflow:hidden}
.gallery img,.gallery iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.slide-label{position:absolute;left:10px;bottom:10px;font-family:var(--f-mono);font-size:11px;color:#fff;
  background:rgba(20,16,12,.6);padding:3px 8px;border-radius:4px}
.thumbs{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:var(--panel)}
.thumb{flex:none;width:66px;height:44px;border:2px solid transparent;border-radius:4px;overflow:hidden;background:#333;padding:0}
.thumb.act{border-color:var(--oxblood)}
.thumb img,.thumb .tv{width:100%;height:100%;object-fit:cover}
.thumb .tv{display:flex;align-items:center;justify-content:center;color:#cdbfa3;font-family:var(--f-mono);font-size:9px;text-align:center}
.info{padding:16px 20px 20px}
.info h2{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:24px;margin:0 0 4px}
.info .tag{font-family:var(--f-mono);font-size:12px;color:var(--rc);margin-bottom:8px}
.info .addr{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);margin-bottom:8px}
.info .notes{font-size:16px;line-height:1.5;margin-bottom:14px}
.dlinks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.dlinks a{font-family:var(--f-mono);font-size:12px;color:#fff;background:var(--rc);border-radius:6px;padding:8px 14px;text-decoration:none}
.dlinks a.alt{background:var(--panel)}
.dlinks a:hover{opacity:.9}
.nav{display:flex;gap:8px}

/* leaflet */
.town-tip{background:transparent;border:none;box-shadow:none;font-family:var(--f-mono);font-size:10px;color:var(--ink);
  text-shadow:0 0 3px var(--paper),0 0 3px var(--paper);padding:0}
.leaflet-popup-content{font-family:var(--f-body);font-size:13px;margin:9px 11px}
.leaflet-popup-content b{font-family:var(--f-disp);text-transform:uppercase}

.foot{background:var(--panel);color:#8a7f6c;font-family:var(--f-mono);font-size:11px;padding:8px 18px;border-top:1px solid #000}

@media(max-width:820px){
  .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .list{max-height:38vh}
  #map{min-height:40vh}
}
:focus-visible{outline:2px solid var(--oxblood);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- v3: area breadcrumb, placeholder gallery ---- */
.areas{display:flex;align-items:center;gap:8px;padding:8px 18px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.areas .crumb{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.apill{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.03em;font-size:13px;font-weight:600;
  color:var(--rc);background:#fff;border:1px solid var(--rc);border-radius:20px;padding:4px 14px}
.apill[aria-selected="true"]{background:var(--rc);color:#fff}
.apill .c{font-family:var(--f-mono);font-weight:400;opacity:.75;margin-left:6px}
.gallery .noimg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:#cdbfa3;background:#26201a;text-align:center;padding:20px}
.gallery .noimg .camera{font-size:40px;filter:grayscale(.3);opacity:.8}
.gallery .noimg .hint{font-family:var(--f-mono);font-size:12px;color:#9a8f7b;max-width:340px;line-height:1.5}

/* ---- v4: scene dropdown ---- */
.showlbl{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.select{font-family:var(--f-body);font-size:14px;padding:6px 8px;border:1px solid var(--caliche);border-radius:6px;background:#fff;color:var(--ink);max-width:220px}

/* ---- v5: base note + 3-photo add slots ---- */
.rnote{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);padding:6px 18px;background:var(--paper);border-bottom:1px solid var(--line)}
.thumb.add{background:#2a231b;border-color:#3a332a}
.thumb.add .addn{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#8a7f6c;font-family:var(--f-mono);font-size:12px}
.thumb.add.act{border-color:var(--oxblood)}
.gallery .noimg code{font-family:var(--f-mono);background:#3a332a;color:#e8dcc2;padding:1px 5px;border-radius:3px}

/* ---- v6: gallery arrows, anchor/all sub-section pills ---- */
.galwrap{position:relative}
.garrow{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:40px;height:40px;border-radius:50%;
  border:none;background:rgba(20,16,12,.55);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.garrow:hover{background:var(--oxblood)}
.gprev{left:10px}.gnext{right:10px}
.apill.all{border-style:dashed}
.apill.anchor{font-weight:700}
.apill.anchor[aria-selected="true"]{background:var(--rc);color:#fff}

/* ---- v7: favorites, status, logistics, hover preview, lightbox ---- */
.row{align-items:center}
.row .rstar{flex:none;font-size:16px;color:#b9ab8c;width:20px;text-align:center}
.row .rstar.on{color:#F2C14E}
.row .rmid{display:flex;flex-direction:column;min-width:0;flex:1}
.row .rdot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--idea);margin-left:4px}
.row.st-scouting .rdot{background:var(--toscout)} .row.st-scouted .rdot{background:var(--scouted)}
.row.st-cleared .rdot{background:var(--confirmed)} .row.st-rejected .rdot{background:#9b3b2f}
.row .go{display:none}
.select{max-width:150px}

/* detail actions */
.dactions{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.favbtn{font-family:var(--f-mono);font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--caliche);background:#fff;color:var(--ink-2)}
.favbtn.on{background:#F2C14E;border-color:#d9a72f;color:#3a2c00}
.stbtn{font-family:var(--f-mono);font-size:11px;padding:5px 9px;border-radius:6px;border:1px solid var(--caliche);background:#fff;color:var(--ink-2)}
.stbtn.on{color:#fff;border-color:transparent}
.stbtn.st-idea.on{background:var(--idea)} .stbtn.st-scouting.on{background:var(--toscout)}
.stbtn.st-scouted.on{background:var(--scouted)} .stbtn.st-cleared.on{background:var(--confirmed)}
.stbtn.st-rejected.on{background:#9b3b2f}

/* logistics */
.logistics{display:flex;flex-direction:column;gap:4px;margin:4px 0 14px}
.logistics .lg{display:flex;gap:8px;font-size:14px}
.logistics .lgk{font-family:var(--f-mono);font-size:11px;color:var(--rc);min-width:78px;text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
.logistics .lgv{color:var(--ink)}

/* gallery img clickable */
.gallery img{cursor:zoom-in}

/* hover preview */
.preview{position:fixed;top:150px;right:16px;width:250px;z-index:900;display:none;background:var(--panel);
  border:1px solid var(--caliche);border-radius:10px;padding:10px;box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.preview .pv-name{font-family:var(--f-disp);text-transform:uppercase;font-weight:600;color:var(--bone);font-size:14px;line-height:1.15}
.preview .pv-sub{font-family:var(--f-mono);font-size:10.5px;color:var(--caliche);margin:2px 0 8px}
.preview .pv-imgs{display:flex;flex-direction:column;gap:6px}
.preview .pv-imgs img{width:100%;height:130px;object-fit:cover;border-radius:6px;display:block;background:#333}
.preview .pv-none{color:#8a7f6c;font-family:var(--f-mono);font-size:12px;text-align:center;padding:16px 0}
.preview .pv-hint{font-family:var(--f-mono);font-size:10px;color:#8a7f6c;text-align:center;margin-top:8px}
@media(max-width:900px){.preview{display:none!important}}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lightbox[hidden]{display:none}
.lb-bg{position:absolute;inset:0;background:rgba(10,8,6,.92)}
#lb-img{position:relative;z-index:1;max-width:94vw;max-height:90vh;transform-origin:center;transition:transform .12s ease;cursor:zoom-in;user-select:none}
.lb-hint{position:absolute;bottom:16px;left:0;right:0;z-index:2;text-align:center;color:#cdbfa3;font-family:var(--f-mono);font-size:12px}

/* ---- v8: mobile + lightbox close ---- */
.lb-close{position:absolute;top:12px;right:14px;z-index:3;width:42px;height:42px;border-radius:50%;
  background:rgba(20,16,12,.6);color:#fff;border:none;font-size:26px;line-height:1;cursor:pointer}
.lb-close:hover{background:var(--oxblood)}
.pills,.areas{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;flex-wrap:nowrap}
.pill,.apill{white-space:nowrap;flex:none}

@media(max-width:820px){
  .hdr{padding:10px 12px}
  .hdr h1{font-size:19px} .hdr .loc{display:none}
  .bar{gap:6px;padding:8px 10px;flex-wrap:wrap}
  .search{max-width:none;flex:1 1 100%;order:-1}
  .showlbl{font-size:11px} .select{max-width:44vw}
  .bar .ghost{margin-left:0}
  .wrap{grid-template-columns:1fr;grid-template-rows:auto auto}
  .list{max-height:none;order:2;border-right:none}
  #map{order:1;height:42vh;min-height:240px}
  .row{padding:11px}                    /* bigger tap targets */
  .row .rn{font-size:15px}
  .sheet{width:100vw;max-height:100vh;border-radius:0}
  .gallery{aspect-ratio:4/3}
  .garrow{width:44px;height:44px}
  .info h2{font-size:20px}
  .thumb{width:60px;height:40px}
  .foot{font-size:10px;padding:7px 12px}
}
@media(max-width:520px){
  .dactions{gap:5px}
  .stbtn{font-size:10px;padding:6px 8px}   /* thumb-friendly */
  .favbtn{font-size:11px}
}

/* ---- v8: mobile + google-photo label ---- */
.mobtabs{display:none}
@media(max-width:820px){
  .mobtabs{display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid #000}
  .mobtabs button{flex:1;font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.05em;font-weight:600;
    font-size:14px;padding:10px;border-radius:6px;border:1px solid var(--caliche);background:var(--bone);color:var(--ink)}
  body.show-map #tab-map, body.show-list #tab-list{background:var(--rc);color:#fff;border-color:var(--rc)}
  .wrap{grid-template-columns:1fr;grid-template-rows:1fr}
  .list{max-height:none;height:100%;border-right:none}
  #map{height:100%;display:none}
  body.show-map #map{display:block}
  body.show-map .list{display:none}
  body.show-list .list{display:block}
  body.show-list #map{display:none}
  .sheet{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0}
  .modal{padding:0}
  .gallery{aspect-ratio:auto;height:42vh}
  .bar{flex-wrap:wrap;gap:8px}
  .search{max-width:none;flex:1 1 100%}
  .showlbl{flex:1 1 46%}
  .select{max-width:none;width:100%}
  .bar .ghost{margin-left:0;flex:1 1 100%}
  .hdr{padding:10px 14px}.hdr h1{font-size:19px}
  .hdr .loc{display:none}
  .garrow{width:34px;height:34px;font-size:22px}
}
@media(max-width:420px){
  .pill{padding:4px 9px;font-size:11px}
  .apill{font-size:12px;padding:4px 10px}
}

/* ---- v9: right photo rail + media tab ---- */
.galrow{display:flex;gap:8px;padding:10px 12px 0;align-items:stretch}
.galrow .galwrap{flex:1;min-width:0}
.galrow .thumbs{flex:none;width:104px;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:0;background:transparent;max-height:min(56vh,420px)}
.galrow .thumbs .thumb{width:100%;height:66px;flex:none}
.tabs2{display:flex;gap:6px;margin:6px 0 10px;border-bottom:1px solid var(--line)}
.t2{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.04em;font-weight:600;font-size:13px;
  background:none;border:none;padding:8px 12px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.t2.on{color:var(--rc);border-bottom-color:var(--rc)}
.tabpane[hidden]{display:none}
.media-add{display:flex;gap:8px;margin-bottom:12px}
.media-add input{flex:1;font-family:var(--f-body);font-size:14px;padding:8px 10px;border:1px solid var(--caliche);border-radius:6px;background:#fff}
.media-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.media-cell{position:relative;background:#000;border-radius:8px;overflow:hidden;min-height:90px;display:flex;align-items:center;justify-content:center}
.media-cell img,.media-cell video,.media-cell iframe{width:100%;display:block;border:0}
.media-cell img,.media-cell video{max-height:220px;object-fit:cover}
.media-cell iframe{aspect-ratio:16/9}
.media-file{display:flex;align-items:center;justify-content:center;min-height:90px;padding:14px;color:var(--bone);font-family:var(--f-mono);font-size:12px;text-decoration:none;text-align:center}
.media-file:hover{background:#1a1611}
.media-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(20,16,12,.7);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.media-x:hover{background:var(--oxblood)}
.media-empty{color:var(--ink-2);font-family:var(--f-mono);font-size:12px;padding:10px 0}
@media(max-width:820px){
  .galrow{flex-direction:column;padding:0}
  .galrow .thumbs{width:auto;flex-direction:row;overflow-x:auto;max-height:none;padding:8px 12px}
  .galrow .thumbs .thumb{width:84px;height:56px}
}

/* ---- v10: aerial gallery + media categories + tagged options ---- */
.gallery iframe.gmap{width:100%;height:100%;border:0;display:block}
.gallery .noimg{color:#cdbfa3;font-family:var(--f-mono);font-size:13px}
/* scene-tagged options */
.row.tagged{background:#faf4e4}
.row.tagged .rn::after{content:" \25C6";color:#C99A2E;font-size:10px;vertical-align:middle}
/* media categories */
.media-sec{margin-bottom:14px}
.media-h{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.05em;font-size:12px;font-weight:700;
  color:var(--rc);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:8px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.media-grid.list{display:flex;flex-direction:column;gap:6px}
.media-grid.list .media-cell{min-height:0;background:var(--bone);border:1px solid var(--line)}
.media-contact{padding:10px 12px;font-family:var(--f-mono);font-size:13px;color:var(--ink)}
#media-type{max-width:110px}

</style>
</head>
<body>

  <header class="hdr">
    <div class="hdr-l">
      <h1 id="title">CALAMITIES</h1>
      <span class="loc" id="loc-label">Enchantment · Rosamond, CA</span>
    </div>
    <div class="pills" id="pills" aria-label="Regions"></div>
  </header>

  <div class="areas" id="areas" aria-label="Sub-areas"></div>
  <div class="rnote" id="rnote"></div>
  <div class="mobtabs">
    <button id="tab-list">▤ List</button>
    <button id="tab-map">◎ Map</button>
  </div>

  <div class="bar">
    <input id="search" class="search" type="search" placeholder="Search locations…" aria-label="Search locations">
    <span class="count" id="count"></span>
    <label class="showlbl">Scene <select id="scene-select" class="select"></select></label>
    <label class="showlbl">Filter <select id="filter-select" class="select"></select></label>
    <button id="fit" class="ghost" title="Zoom to Enchantment">⌖ Enchantment</button>
  </div>

  <div class="wrap">
    <aside class="list" id="list" aria-label="Locations"></aside>
    <div id="map" aria-label="Map"></div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-bg" id="modal-bg"></div>

  <script>
/* CALAMITIES — Enchantment Scout · app (edit locations in data.js) */
(function () {
  "use strict";

  const STATUSES = [
    { id: "idea", name: "Idea" }, { id: "scouting", name: "Scouting" },
    { id: "scouted", name: "Scouted" }, { id: "cleared", name: "Cleared \u2713" },
    { id: "rejected", name: "Rejected" }
  ];
  const LOGI = [
    ["contact", "Contact"], ["permit", "Permit"], ["access", "Access"],
    ["bestTime", "Best time"], ["parking", "Parking"], ["power", "Power"],
    ["cost", "Cost"], ["info", "Notes"]
  ];

  const state = { region: "av", area: null, scene: "all", filter: "all", q: "", allRegions: false,
    list: [], idx: 0, slides: [], slide: 0, current: null };
  let map, baseGroup, townGroup, optGroup;
  const pinByName = {};
  let hoverTimer = null;

  /* ---- tiny storage (localStorage w/ in-memory fallback) ---- */
  const mem = {};
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { mem[k] = v; } }
  };
  let FAVS = store.get("cal_favs", {});
  let STAT = store.get("cal_status", {});
  let MEDIA = store.get("cal_media", {});
  Object.keys(MEDIA).forEach(k => { MEDIA[k] = (MEDIA[k] || []).map(m => typeof m === "string" ? { type: "link", value: m } : m); });

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const elc = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const esc = (s) => (s == null ? "" : String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])));
  const slug = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  const regionById = (id) => CONFIG.regions.find(r => r.id === id);
  const sceneById = (id) => (CONFIG.scenes || []).find(s => s.id === id);
  function townsOf(r) {
    return (r.anchorTowns || []).map(t => Object.assign({ type: "anchor", slug: slug(t.name) }, t))
      .concat((r.peripheralTowns || []).map(t => Object.assign({ type: "peripheral", slug: slug(t.name) }, t)));
  }
  const selectedTown = () => townsOf(regionById(state.region)).find(t => t.slug === state.area) || null;

  const KEY = (CONFIG.googleMapsKey || "").trim();
  const idOf = (o) => o.region + "|" + o.name;
  const isFav = (o) => !!FAVS[idOf(o)];
  const getStatus = (o) => STAT[idOf(o)] || o.status || "idea";
  const statusName = (id) => (STATUSES.find(s => s.id === id) || { name: id }).name;
  function toggleFav(o) { const k = idOf(o); if (FAVS[k]) delete FAVS[k]; else FAVS[k] = 1; store.set("cal_favs", FAVS); }
  function setStatus(o, s) { STAT[idOf(o)] = s; store.set("cal_status", STAT); }

  const qOf = (o) => encodeURIComponent(o.address || (o.lat != null ? o.lat + "," + o.lng : (o.name + " " + (o.town || ""))));
  const mapsLink = (o) => `https://www.google.com/maps/search/?api=1&query=${qOf(o)}`;
  const imgLink = (o) => `https://www.google.com/search?tbm=isch&q=${encodeURIComponent((o.name || "") + " " + (o.town || "") + " CA")}`;
  const svLink = (o) => (o.lat != null ? `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${o.lat},${o.lng}` : mapsLink(o));

  /* ---- keyless aerial imagery (Esri World Imagery — no API key needed) ---- */
  const sat = (o, dLat) => {
    if (o.lat == null) return "";
    const dLng = dLat * 2.0;
    return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=${o.lng - dLng},${o.lat - dLat},${o.lng + dLng},${o.lat + dLat}&bboxSR=4326&imageSR=4326&size=900,506&format=jpg&f=image`;
  };
  const SAT_LEVELS = [0.0006, 0.0016, 0.0045];
  function aerialSlides(o) {
    if (o.lat == null) return [];
    const names = ["Aerial — close", "Aerial — block", "Aerial — area"];
    return SAT_LEVELS.map((d, i) => ({ type: "img", src: sat(o, d), label: names[i] }));
  }
  const gmapEmbed = (o) => `https://maps.google.com/maps?q=${qOf(o)}&z=17&output=embed`;
  function loadPhotos(o) {
    let slides = aerialSlides(o);
    slides.push({ type: "embed", src: gmapEmbed(o), label: "Google map" });
    state.slides = slides; renderThumbs(); showSlide(0);
  }
  const photosOf = (o) => (o.photos && o.photos.length ? o.photos : (o.photo ? [o.photo] : []));

  function matchQ(o) {
    if (!state.q) return true;
    const sc = (o.scenes || []).map(id => (sceneById(id) || {}).name || id).join(" ");
    const hay = (o.name + " " + (o.town || "") + " " + (o.address || "") + " " + (o.notes || "") + " " + sc + " " + o.region).toLowerCase();
    return hay.includes(state.q.toLowerCase());
  }
  function passFilter(o) {
    const f = state.filter;
    if (f === "all") return true;
    if (f === "fav") return isFav(o);
    if (f === "cleared") return getStatus(o) === "cleared";
    if (f === "uncleared") return getStatus(o) !== "cleared";
    return getStatus(o) === f;
  }
  function filtered() {
    return OPTIONS.filter(o => state.allRegions || o.region === state.region)
      .filter(o => state.allRegions || !state.area || o.area === state.area)
      .filter(o => state.scene === "all" || (o.scenes && o.scenes.indexOf(state.scene) !== -1))
      .filter(passFilter).filter(matchQ)
      .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  }
  const inArea = (o) => !state.area || o.area === state.area;
  const sceneCount = (id) => OPTIONS.filter(o => o.region === state.region && inArea(o) && o.scenes && o.scenes.indexOf(id) !== -1).length;
  const areaCount = (sl) => OPTIONS.filter(o => o.region === state.region && o.area === sl).length;

  /* ---- pills / areas / dropdowns ---- */
  function buildPills() {
    const box = $("#pills"); box.innerHTML = "";
    CONFIG.regions.forEach(r => {
      const n = OPTIONS.filter(o => o.region === r.id).length;
      const b = elc("button", "pill", `${esc(r.name)}<span class="c">${n}</span>`);
      b.setAttribute("aria-selected", !state.allRegions && r.id === state.region);
      b.addEventListener("click", () => switchRegion(r.id));
      box.appendChild(b);
    });
    const allb = elc("button", "pill allregions", "All regions");
    allb.setAttribute("aria-selected", state.allRegions);
    allb.addEventListener("click", () => { state.allRegions = !state.allRegions; if (state.allRegions) state.area = null; refresh(); if (state.allRegions) fitPins(); else fitArea(); });
    box.appendChild(allb);
  }
  function buildAreas() {
    const box = $("#areas"); box.innerHTML = "";
    if (state.allRegions) { box.style.display = "none"; return; }
    box.style.display = "flex";
    const r = regionById(state.region);
    const all = elc("button", "apill all", `All ${esc(r.name)}`);
    all.setAttribute("aria-selected", !state.area);
    all.addEventListener("click", () => { state.area = null; refresh(); fitArea(); });
    box.appendChild(all);
    const grp = (label, towns) => {
      if (!towns.length) return;
      box.appendChild(elc("span", "crumb", label));
      towns.forEach(t => {
        const tt = Object.assign({ slug: slug(t.name) }, t);
        const n = areaCount(tt.slug);
        const b = elc("button", "apill" + (label[0] === "A" ? " anchor" : ""),
          `${esc(t.name)}${n ? `<span class="c">${n}</span>` : ""}`);
        b.setAttribute("aria-selected", tt.slug === state.area);
        b.addEventListener("click", () => { state.area = tt.slug; refresh(); fitArea(); });
        box.appendChild(b);
      });
    };
    grp("Anchors:", r.anchorTowns || []);
    grp("Peripherals:", r.peripheralTowns || []);
  }
  function buildSceneSelect() {
    const sel = $("#scene-select"); sel.innerHTML = "";
    const total = OPTIONS.filter(o => (state.allRegions || o.region === state.region) && (state.allRegions || inArea(o))).length;
    sel.appendChild(new Option(`All locations (${total})`, "all"));
    const rows = (CONFIG.scenes || []).map(sc => ({ sc, n: sceneCount(sc.id) }));
    rows.sort((a, b) => (b.n > 0) - (a.n > 0));
    rows.forEach(({ sc, n }) => sel.appendChild(new Option(`${sc.name}  (${n})`, sc.id)));
    sel.value = state.scene;
  }
  function buildFilterSelect() {
    const sel = $("#filter-select"); if (!sel) return; sel.innerHTML = "";
    sel.appendChild(new Option("All", "all"));
    sel.appendChild(new Option("\u2605 Favorites", "fav"));
    sel.appendChild(new Option("Cleared \u2713", "cleared"));
    sel.appendChild(new Option("Not cleared", "uncleared"));
    STATUSES.filter(s => s.id !== "cleared").forEach(s => sel.appendChild(new Option(s.name, s.id)));
    sel.value = state.filter;
  }

  /* ---- list ---- */
  function buildList() {
    state.list = filtered();
    const box = $("#list"); box.innerHTML = "";
    $("#count").textContent = `${state.list.length} location${state.list.length === 1 ? "" : "s"}`;
    if (!state.list.length) { box.appendChild(elc("div", "empty", "No matches.<br>Try All regions, or clear the filter.")); return; }
    state.list.forEach((o) => {
      const st = getStatus(o);
      const tagged = o.scenes && o.scenes.length;
      const row = elc("button", "row st-" + st + (tagged ? " tagged" : ""),
        `<span class="rstar${isFav(o) ? " on" : ""}" data-fav="1">${isFav(o) ? "\u2605" : "\u2606"}</span>` +
        `<span class="rmid"><span class="rn">${esc(o.name)}</span>` +
        `<span class="rs">${esc(o.address || o.town || "")}${state.allRegions ? " \u00B7 " + esc(regionById(o.region).name) : ""}</span></span>` +
        `<span class="rdot" title="${esc(statusName(st))}"></span>`);
      row.dataset.name = o.name; row.dataset.region = o.region;
      row.addEventListener("click", (e) => {
        if (e.target.closest(".rstar")) { toggleFav(o); buildList(); return; }
        openModal(o);
      });
      row.addEventListener("mouseenter", () => { clearTimeout(hoverTimer); hoverTimer = setTimeout(() => previewShow(o), 120); });
      row.addEventListener("mouseleave", () => { clearTimeout(hoverTimer); hoverTimer = setTimeout(previewHide, 200); });
      box.appendChild(row);
    });
  }
  function markSelected(o) { $$(".row").forEach(r => r.classList.toggle("sel", r.dataset.name === (o && o.name) && r.dataset.region === (o && o.region))); }

  /* ---- hover preview ---- */
  function previewShow(o) {
    const box = $("#preview");
    let imgs = photosOf(o).slice(0, 3).map(p => `<img src="${esc(p)}" loading="lazy" alt="">`);
    if (o.lat != null) imgs = imgs.concat(aerialSlides(o).slice(0, Math.max(1, 3 - imgs.length)).map(s => `<img src="${s.src}" loading="lazy" alt="">`));
    box.innerHTML = `<div class="pv-name">${esc(o.name)}</div>` +
      `<div class="pv-sub">${esc(o.address || o.town || "")}</div>` +
      `<div class="pv-imgs">${imgs.length ? imgs.join("") : '<div class="pv-none">No photo yet</div>'}</div>` +
      `<div class="pv-hint">click for full size</div>`;
    box.style.display = "block";
  }
  function previewHide() { $("#preview").style.display = "none"; }

  /* ---- map ---- */
  function initMap() {
    const t = selectedTown(); const r = regionById(state.region);
    const start = t ? { center: t.center || [t.lat, t.lng], zoom: t.zoom || 14 } : r;
    map = L.map("map", { zoomControl: true, scrollWheelZoom: true }).setView(start.center, start.zoom);
    const road = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
      { attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 19, subdomains: "abcd" });
    const satLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { attribution: "Imagery &copy; Esri", maxZoom: 19 });
    road.addTo(map);
    L.control.layers({ "Map": road, "Satellite": satLayer }, null, { position: "topright" }).addTo(map);
    baseGroup = L.layerGroup().addTo(map);
    townGroup = L.layerGroup().addTo(map);
    optGroup = L.layerGroup().addTo(map);
  }
  function townMarker(t, big) {
    if (t.lat == null) return;
    townGroup.addLayer(L.circleMarker([t.lat, t.lng], {
      radius: big ? 8 : (t.type === "anchor" ? 7 : 5), color: "#fff", weight: 1.4,
      fillColor: regionById(state.region).color, fillOpacity: t.type === "anchor" || big ? .9 : .55
    }).bindTooltip(t.name, { permanent: true, direction: "right", className: "town-tip", offset: [8, 0] }));
  }
  function drawMap() {
    const r = regionById(state.region); const t = selectedTown();
    baseGroup.clearLayers(); townGroup.clearLayers(); optGroup.clearLayers();
    for (const k in pinByName) delete pinByName[k];
    if (!state.allRegions) {
      if (t && t.perimeter) baseGroup.addLayer(L.polygon(t.perimeter, { color: r.color, weight: 2.5, dashArray: "6 6", fillColor: r.color, fillOpacity: .05 }));
      if (!state.area) townsOf(r).forEach(tw => townMarker(tw));
      else if (t) townMarker(t, true);
    }
    filtered().forEach(o => {
      if (o.lat == null) return;
      const tagged = o.scenes && o.scenes.length;
      const col = tagged ? "#C99A2E" : regionById(o.region).color;
      const d = tagged ? 15 : 12;
      const icon = L.divIcon({ className: "", iconSize: [d + 4, d + 4], iconAnchor: [(d + 4) / 2, (d + 4) / 2],
        html: `<div style="width:${d}px;height:${d}px;border-radius:50%;background:${col};border:2px solid ${isFav(o) ? "#F2C14E" : "#fff"};box-shadow:0 1px 3px rgba(0,0,0,.5)"></div>` });
      const m = L.marker([o.lat, o.lng], { icon }).bindTooltip(o.name, { direction: "top" });
      m.on("click", () => openModal(o));
      m.on("mouseover", () => previewShow(o)); m.on("mouseout", () => setTimeout(previewHide, 200));
      optGroup.addLayer(m); pinByName[idOf(o)] = m;
    });
  }
  function fitArea() {
    const t = selectedTown(); const r = regionById(state.region);
    if (t && t.perimeter) map.flyTo(t.center || [t.lat, t.lng], t.zoom || 16, { duration: .6 });
    else if (t) map.flyTo([t.lat, t.lng], t.zoom || 14, { duration: .6 });
    else map.flyTo(r.center, r.zoom, { duration: .6 });
  }
  function fitPins() {
    const pts = filtered().filter(o => o.lat != null).map(o => [o.lat, o.lng]);
    if (pts.length) map.flyToBounds(pts, { padding: [40, 40], maxZoom: 15, duration: .6 });
  }

  /* ---- gallery / modal ---- */
  function renderThumbs() {
    const th = $("#thumbs"); th.innerHTML = "";
    state.slides.forEach((s, k) => {
      const inner = s.type === "img" ? `<img src="${esc(s.src)}" loading="lazy" alt="">`
        : (s.type === "embed" ? `<span class="tv">GOOGLE<br>MAP</span>` : `<span class="tv">—</span>`);
      const t = elc("button", "thumb" + (s.type === "img" ? "" : " add"), inner);
      t.addEventListener("click", () => showSlide(k));
      th.appendChild(t);
    });
    th.style.display = "flex";
  }
  function showSlide(i) {
    state.slide = i; const s = state.slides[i]; if (!s) return;
    const g = $("#gallery");
    if (s.type === "img") {
      g.innerHTML = "";
      const im = elc("img"); im.src = s.src; im.loading = "lazy"; im.alt = "";
      im.addEventListener("click", () => openLightbox(s.src));
      im.addEventListener("error", () => { const ei = state.slides.findIndex(x => x.type === "embed"); if (ei >= 0 && ei !== i) showSlide(ei); });
      g.appendChild(im);
      g.appendChild(elc("span", "slide-label", esc(s.label || "")));
    } else if (s.type === "embed") {
      g.innerHTML = `<iframe class="gmap" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${s.src}" title="Google map"></iframe>`;
      g.appendChild(elc("span", "slide-label", esc(s.label || "Google map")));
    } else {
      g.innerHTML = `<div class="noimg"><div>No view available</div></div>`;
    }
    $$("#thumbs .thumb").forEach((t, k) => t.classList.toggle("act", k === i));
  }
  function galStep(d) { const n = state.slides.length; if (!n) return; showSlide((state.slide + d + n) % n); }

  function buildActions(o) {
    const box = $("#d-actions"); box.innerHTML = "";
    const fav = elc("button", "favbtn" + (isFav(o) ? " on" : ""), (isFav(o) ? "\u2605" : "\u2606") + " Favorite");
    fav.addEventListener("click", () => { toggleFav(o); buildActions(o); buildList(); drawMap(); });
    box.appendChild(fav);
    const cur = getStatus(o);
    STATUSES.forEach(s => {
      const b = elc("button", "stbtn st-" + s.id + (cur === s.id ? " on" : ""), s.name);
      b.addEventListener("click", () => { setStatus(o, s.id); buildActions(o); buildList(); drawMap(); });
      box.appendChild(b);
    });
  }
  function buildLogistics(o) {
    const box = $("#d-logistics"); box.innerHTML = "";
    const rows = LOGI.filter(([k]) => o[k]).map(([k, label]) => `<div class="lg"><span class="lgk">${label}</span><span class="lgv">${esc(o[k])}</span></div>`);
    box.innerHTML = rows.join("");
  }

  /* ---- media tab: categories (photos / videos / pdfs / links / contact) ---- */
  function mediaOf(o) { return (MEDIA[idOf(o)] || []).map(m => typeof m === "string" ? { type: "link", value: m } : m); }
  function addMedia(o, type, value) { value = (value || "").trim(); if (!value) return; const a = MEDIA[idOf(o)] || []; a.push({ type, value }); MEDIA[idOf(o)] = a; store.set("cal_media", MEDIA); renderMedia(o); }
  function removeMedia(o, i) { const a = MEDIA[idOf(o)] || []; a.splice(i, 1); MEDIA[idOf(o)] = a; store.set("cal_media", MEDIA); renderMedia(o); }
  function mediaEl(m) {
    const url = m.value, u = (url || "").toLowerCase();
    if (m.type === "contact") return `<div class="media-contact">\uD83D\uDCC7 ${esc(url)}</div>`;
    if (m.type === "photo") return `<img src="${esc(url)}" loading="lazy" alt="">`;
    if (m.type === "video") {
      const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/);
      if (yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen loading="lazy"></iframe>`;
      const vm = u.match(/vimeo\.com\/(\d+)/);
      if (vm) return `<iframe src="https://player.vimeo.com/video/${vm[1]}" allowfullscreen loading="lazy"></iframe>`;
      if (/\.(mp4|webm|mov)(\?|$)/.test(u)) return `<video src="${esc(url)}" controls preload="none"></video>`;
      return `<a class="media-file" href="${esc(url)}" target="_blank" rel="noopener">\u25B6 ${esc(url.replace(/^https?:\/\//, "").slice(0, 40))}</a>`;
    }
    if (m.type === "pdf") return `<a class="media-file" href="${esc(url)}" target="_blank" rel="noopener">\uD83D\uDCC4 ${esc(url.replace(/^https?:\/\//, "").slice(0, 40)) || "PDF"}</a>`;
    return `<a class="media-file" href="${esc(url)}" target="_blank" rel="noopener">\uD83D\uDD17 ${esc(url.replace(/^https?:\/\//, "").slice(0, 40))}</a>`;
  }
  function renderMedia(o) {
    const box = $("#media-list"); const a = mediaOf(o);
    if (!a.length) { box.innerHTML = '<div class="media-empty">Nothing yet. Pick a type, paste a link (or type contact info), and Add.</div>'; return; }
    box.innerHTML = "";
    [["photo", "Photos"], ["video", "Videos"], ["pdf", "PDFs"], ["link", "Links"], ["contact", "Contact"]].forEach(([t, label]) => {
      const items = a.map((m, i) => ({ m, i })).filter(x => x.m.type === t);
      if (!items.length) return;
      const sec = elc("div", "media-sec", `<div class="media-h">${label}</div>`);
      const grid = elc("div", "media-grid" + (t === "contact" || t === "pdf" || t === "link" ? " list" : ""));
      items.forEach(({ m, i }) => grid.appendChild(elc("div", "media-cell " + t, mediaEl(m) + `<button class="media-x" data-i="${i}" title="Remove">\u00D7</button>`)));
      sec.appendChild(grid); box.appendChild(sec);
    });
    $$(".media-x", box).forEach(b => b.addEventListener("click", () => removeMedia(o, +b.dataset.i)));
  }
  function showTab(which) {
    $("#pane-details").hidden = which !== "details";
    $("#pane-media").hidden = which !== "media";
    $("#tab-details").classList.toggle("on", which === "details");
    $("#tab-media").classList.toggle("on", which === "media");
  }

  function openModal(o) {
    state.current = o; previewHide();
    const list = state.list.length ? state.list : filtered();
    state.idx = list.indexOf(o);
    markSelected(o);
    if (pinByName[idOf(o)]) map.flyTo(pinByName[idOf(o)].getLatLng(), Math.max(map.getZoom(), 16), { duration: .5 });
    $("#d-name").textContent = o.name || "Untitled";
    $("#d-addr").textContent = (o.address || o.town || "") + (state.allRegions ? "  ·  " + regionById(o.region).name : "");
    const links = $("#d-links"); links.innerHTML = "";
    links.appendChild(mkLink(mapsLink(o), "\uD83D\uDCF7 Google photos", false));
    if (o.lat != null) links.appendChild(mkLink(svLink(o), "Street View \u2197", true));
    links.appendChild(mkLink(imgLink(o), "Image search \u2197", true));
    buildActions(o); buildLogistics(o); renderMedia(o); showTab("details");
    loadPhotos(o);
    $("#modal").hidden = false;
  }
  function mkLink(href, txt, alt) { const a = elc("a", alt ? "alt" : "", txt); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a; }
  function closeModal() { $("#modal").hidden = true; state.current = null; markSelected(null); }
  function step(d) {
    const list = state.list.length ? state.list : filtered(); if (!list.length) return;
    let i = state.idx + d; if (i < 0) i = list.length - 1; if (i >= list.length) i = 0;
    openModal(list[i]);
  }

  /* ---- lightbox ---- */
  let lbZoom = 1;
  function openLightbox(src) { const lb = $("#lightbox"); $("#lb-img").src = src; lbZoom = 1; applyZoom(); lb.hidden = false; }
  function closeLightbox() { $("#lightbox").hidden = true; }
  function applyZoom() { $("#lb-img").style.transform = "scale(" + lbZoom + ")"; }
  function zoomBy(f) { lbZoom = Math.min(6, Math.max(1, lbZoom * f)); applyZoom(); }

  /* ---- switch / refresh ---- */
  function switchRegion(id) {
    state.allRegions = false; state.region = id; state.q = ""; state.scene = "all"; state.filter = "all";
    $("#search").value = "";
    const r = regionById(id);
    state.area = r.defaultArea || null;
    document.documentElement.style.setProperty("--rc", r.color);
    refresh(); fitArea();
  }
  function refresh() {
    const r = regionById(state.region); const t = selectedTown();
    document.documentElement.style.setProperty("--rc", state.allRegions ? "#6b5d47" : r.color);
    $("#loc-label").textContent = state.allRegions ? "All regions" : (t ? t.name : "All " + r.name);
    const rn = $("#rnote"); const note = state.allRegions ? "" : (r.note || "");
    rn.textContent = note; rn.style.display = note ? "block" : "none";
    $$(".pill").forEach((p, i) => { if (i < CONFIG.regions.length) p.setAttribute("aria-selected", !state.allRegions && CONFIG.regions[i].id === state.region); });
    const allp = $(".pill.allregions"); if (allp) allp.setAttribute("aria-selected", state.allRegions);
    buildAreas(); buildSceneSelect(); buildFilterSelect(); buildList(); drawMap();
  }

  /* ---- boot ---- */
  document.addEventListener("DOMContentLoaded", () => {
    const r = regionById(state.region);
    state.area = r.defaultArea || null;
    document.documentElement.style.setProperty("--rc", r.color);
    $("#title").textContent = CONFIG.title;
    buildPills();
    initMap();
    refresh();
    $("#search").addEventListener("input", (e) => { state.q = e.target.value; buildList(); drawMap(); if (state.q) fitPins(); });
    $("#scene-select").addEventListener("change", (e) => { state.scene = e.target.value; buildList(); drawMap(); });
    $("#filter-select").addEventListener("change", (e) => { state.filter = e.target.value; buildList(); drawMap(); });
    function goEnchantment() {
      state.allRegions = false; state.region = "av"; state.area = "rosamond";
      state.scene = "all"; state.filter = "all"; state.q = ""; $("#search").value = "";
      document.documentElement.style.setProperty("--rc", regionById("av").color);
      refresh(); fitArea();
    }
    $("#fit").addEventListener("click", goEnchantment);
    $("#x").addEventListener("click", closeModal);
    $("#modal-bg").addEventListener("click", closeModal);
    $("#prev").addEventListener("click", () => step(-1));
    $("#next").addEventListener("click", () => step(1));
    $("#gprev").addEventListener("click", () => galStep(-1));
    $("#gnext").addEventListener("click", () => galStep(1));
    $("#tab-details").addEventListener("click", () => showTab("details"));
    $("#tab-media").addEventListener("click", () => showTab("media"));
    $("#media-add-btn").addEventListener("click", () => { const inp = $("#media-url"); const ty = $("#media-type").value; if (state.current) { addMedia(state.current, ty, inp.value); inp.value = ""; } });
    $("#media-url").addEventListener("keydown", (e) => { if (e.key === "Enter" && state.current) { const inp = $("#media-url"); const ty = $("#media-type").value; addMedia(state.current, ty, inp.value); inp.value = ""; } });
    // lightbox
    $("#lb-bg").addEventListener("click", closeLightbox);
    $("#lb-close").addEventListener("click", closeLightbox);
    $("#lb-img").addEventListener("click", (e) => { e.stopPropagation(); zoomBy(1.5); });
    $("#lightbox").addEventListener("wheel", (e) => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
    document.addEventListener("keydown", (e) => {
      if (!$("#lightbox").hidden) {
        if (e.key === "Escape" || e.key === " ") { e.preventDefault(); closeLightbox(); }
        if (e.key === "+" || e.key === "=") zoomBy(1.25);
        if (e.key === "-") zoomBy(1 / 1.25);
        return;
      }
      if ($("#modal").hidden) return;
      if (e.key === "Escape") closeModal();
      if (e.key === "ArrowLeft") galStep(-1);
      if (e.key === "ArrowRight") galStep(1);
      if (e.key === "[") step(-1);
      if (e.key === "]") step(1);
    });
    const tl = $("#tab-list"), tm = $("#tab-map");
    if (tl && tm) {
      tl.addEventListener("click", () => { document.body.classList.remove("show-map"); document.body.classList.add("show-list"); });
      tm.addEventListener("click", () => { document.body.classList.remove("show-list"); document.body.classList.add("show-map"); setTimeout(() => map.invalidateSize(), 120); });
    }
    if (window.innerWidth <= 820) document.body.classList.add("show-list");
    $("#foot").innerHTML = "<b style='color:#C99A2E'>BUILD 12 — aerial photos + media categories + scene colors</b> · hover to peek · click a photo to zoom (space/esc) · \u2605 & status save in your browser.";
  });
})();

</script>
</body>
</html>
